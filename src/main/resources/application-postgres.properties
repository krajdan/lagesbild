# Produktionsprofil: PostgreSQL. Aktiveras med SPRING_PROFILES_ACTIVE=postgres
# Konfigurera via miljovariabler (satts av t.ex. Render/docker-compose).

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/lagesbild}
spring.datasource.username=${DATABASE_USER:lagesbild}
spring.datasource.password=${DATABASE_PASSWORD:lagesbild}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health,info
