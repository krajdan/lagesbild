spring.application.name=lagesbild

# Standardprofil: in-memory H2 sa att appen startar utan installation.
spring.datasource.url=jdbc:h2:mem:lagesbild;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# H2-konsol pa /h2-console for felsokning under utveckling.
spring.h2.console.enabled=true

# Halsoendpoint for drift/overvakning: /actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

server.port=8080
